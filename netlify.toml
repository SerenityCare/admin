# Normalize Netlify Pretty-URL versions of the old /production paths.
[[redirects]]
  from = "/production/login"
  to = "/login"
  status = 301

[[redirects]]
  from = "/production/index"
  to = "/dashboard"
  status = 301

[[redirects]]
