[build]
  command = "npm run verify:deploy"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_SERENITY_ADMIN_API_BASE = "https://serenity-backend-mseu.onrender.com/api/admin"

[build.processing.html]
  pretty_urls = true

# Canonical entry point.
[[redirects]]
  from = "/"
  to = "/login"
  status = 302

# Pretty public routes. These are rewrites, so the clean URL stays in the browser.
[[redirects]]
  from = "/login"
  to = "/production/login.html"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard"
  to = "/production/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/scheduling"
  to = "/production/index2.html"
  status = 200
  force = true

[[redirects]]
  from = "/clinical"
  to = "/production/index3.html"
  status = 200
  force = true

[[redirects]]
  from = "/finance"
  to = "/production/index4.html"
  status = 200
  force = true

[[redirects]]
  from = "/operations"
  to = "/production/operations.html"
  status = 200
  force = true

[[redirects]]
  from = "/reports"
  to = "/production/chartjs.html"
  status = 200
  force = true

[[redirects]]
  from = "/calendar"
  to = "/production/calendar.html"
  status = 200
  force = true

[[redirects]]
  from = "/inbox"
  to = "/production/inbox.html"
  status = 200
  force = true

[[redirects]]
  from = "/staff"
  to = "/production/staff.html"
  status = 200
  force = true

# Backward-compatible redirects for old HTML URLs.
[[redirects]]
  from = "/production/login.html"
  to = "/login"
  status = 301
  force = true

[[redirects]]
  from = "/production/index.html"
  to = "/dashboard"
  status = 301
  force = true

