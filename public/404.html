<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Page Not Found | Serenity Admin</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:Arial,sans-serif;color:#203247}
    main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    section{width:min(480px,100%);background:#fff;border:1px solid #e5eaf0;border-radius:18px;padding:34px;box-shadow:0 16px 48px rgba(32,50,71,.10);text-align:center}
    .mark{width:48px;height:48px;border-radius:14px;background:#1abb9c;color:#fff;display:grid;place-items:center;font-weight:800;margin:0 auto 18px}
    h1{font-size:1.5rem;margin:0 0 10px}p{color:#6f7e8d;line-height:1.5;margin:0 0 22px}
    a{display:inline-block;background:#1abb9c;color:#fff;text-decoration:none;font-weight:800;padding:12px 18px;border-radius:9px}
  </style>
</head>
<body>
  <main>
    <section>
      <div class="mark">S</div>
      <h1>Page not found</h1>
      <p>The Serenity Admin address you requested does not exist.</p>
      <a href="/dashboard">Return to Admin</a>
    </section>
  </main>
</body>
</html>
